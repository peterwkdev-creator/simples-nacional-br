# Catálogo oficial de servidores MCP (registry.modelcontextprotocol.io).
# A cada Release publicada: monta o pacote MCPB (mcpb/montar.py), anexa à
# Release, confere o hash do que o GitHub serve e publica o server.json com o
# login OIDC do GitHub, sem segredo. Comandos conferidos em 10/10/2026
# (mcp-publisher v1.8.1; docs/modelcontextprotocol-io/github-actions.mdx do
# modelcontextprotocol/registry).
#
# Os testes rodam num job só de leitura; o de publicar tem a escrita e o OIDC
# e monta de novo o pacote (o zip é reprodutível: o mesmo hash).
name: Catálogo MCP
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Testes
        run: python -m unittest -q
      - name: A tag é a versão da biblioteca
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(python -c 'import simples_nacional as s; print(s.__version__)')"

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # anexar o .mcpb à Release
      id-token: write  # login OIDC no catálogo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Montar o pacote e o server.json
        run: python mcpb/montar.py --saida dist
      - name: Anexar o pacote à Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.mcpb --clobber
      - name: O endereço do server.json serve o mesmo arquivo
        run: |
          url=$(python -c "import json; print(json.load(open('dist/server.json'))['packages'][0]['identifier'])")
          sha=$(python -c "import json; print(json.load(open('dist/server.json'))['packages'][0]['fileSha256'])")
          test "$(curl -sfL "$url" | sha256sum | cut -d' ' -f1)" = "$sha"
      # sha256 do asset da release v1.8.1, lido na API do GitHub em 10/10/2026
      - name: mcp-publisher v1.8.1, conferido
        run: |
          curl -sfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validar e publicar
        run: |
          ./mcp-publisher validate dist/server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish dist/server.json
