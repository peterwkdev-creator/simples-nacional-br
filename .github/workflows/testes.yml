# Testes a cada push e pull request, em todas as versões do Python que o
# pyproject aceita (requires-python >= 3.9). Roda do checkout limpo, sem
# instalar nada, como diz o README. Um job no Windows confere a saída da
# linha de comando fora do UTF-8 (cp1252).
name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    # a suíte leva uns 2 s; sem teto, um processo preso segura o job por 6 h
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
