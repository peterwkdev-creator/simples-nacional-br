# Testes a cada push e pull request, em todas as versões do Python que o
# pyproject aceita (requires-python >= 3.9). Roda do checkout limpo, sem
# instalar nada, como diz o README. Um job no Windows confere a saída da
# linha de comando fora do UTF-8 (cp1252). O job "pacote" monta o wheel e
# roda o que o pip instala, como o pypi.yml antes de publicar.
name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    # a suíte leva uns 2 s; sem teto, um processo preso segura o job por 6 h
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.14: o Python do Pyodide da vitrine
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v

  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: bash .github/conferir-instalado.sh
      # o PyPI recusa descrição que não renderiza; aqui o aviso vem no push,
      # não na Release (a action confere de novo antes de publicar)
      - run: |
          python -m pip install --quiet "twine==7.0.0"
          python -m twine check --strict dist/*
