# Vitrine no GitHub Pages.
# Versões conferidas em 10/10/2026 (último release de cada action). Os testes
# e a montagem rodam só com leitura; a escrita no Pages e o OIDC ficam no job
# que publica, como no modelo do próprio GitHub Pages.
name: Vitrine
on:
  push:
    branches: [main]
    paths: ["simples_nacional/**", "vitrine/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # A mesma versão do Python que o Pyodide 314 roda no navegador.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Testes (a vitrine só sai se a biblioteca passar)
        run: python -m unittest -q
      - name: Montar
        run: python vitrine/montar.py --saida _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
