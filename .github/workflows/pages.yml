# Vitrine no GitHub Pages (modelo da Coordenação, modelo/vitrine/LEIA-ME.md).
# Mora em .github/workflows/pages.yml do repositório público da biblioteca.
# Trocar PACOTE pelo nome da pasta do pacote. Antes do 1º push: Settings →
# Pages → Source: "GitHub Actions" (é do usuário). Versões conferidas em
# 10/10/2026 (último release de cada action).
name: Vitrine
on:
  push:
    branches: [main]
    paths: ["simples_nacional/**", "vitrine/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # A mesma versão do Python que o Pyodide 314 roda no navegador.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Testes (a vitrine só sai se a biblioteca passar)
        run: python -m unittest -q
      - name: Montar
        run: python vitrine/montar.py --saida _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
