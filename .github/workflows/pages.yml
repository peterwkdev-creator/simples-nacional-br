# Vitrine no GitHub Pages (modelo da Coordenação, modelo/vitrine/LEIA-ME.md).
# Versões conferidas em 10/10/2026 (último release de cada action). Os testes
# e a montagem rodam só com leitura; a escrita no Pages e o OIDC ficam no job
# que publica, como no modelo do próprio GitHub Pages.
name: Vitrine
on:
  push:
    branches: [main]
    paths: ["simples_nacional/**", "vitrine/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A mesma versão do Python que o Pyodide 314 roda no navegador.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Testes (a vitrine só sai se a biblioteca passar)
        run: python -m unittest -q
      - name: Montar
        run: python vitrine/montar.py --saida _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
