[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simples-nacional-br"  # o do repositório e do catálogo MCP
dynamic = ["version"]  # uma fonte só: simples_nacional.__version__
description = "Simples Nacional: alíquota efetiva, valor do mês e Fator R, conferidos contra a LC 123/2006 e a LC 214/2025"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["simples nacional", "das", "fator r", "lc 123", "tributário"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
simples-nacional = "simples_nacional.__main__:main"
simples-nacional-cnae = "simples_nacional.cnae:main"
simples-nacional-mcp = "simples_nacional.mcp:main"

[project.urls]
Homepage = "https://github.com/peterwkdev-creator/simples-nacional-br"
Issues = "https://github.com/peterwkdev-creator/simples-nacional-br/issues"
Changelog = "https://github.com/peterwkdev-creator/simples-nacional-br/blob/main/CHANGELOG.md"
Experimente = "https://peterwkdev-creator.github.io/simples-nacional-br/"

[tool.setuptools]
packages = ["simples_nacional"]

[tool.setuptools.package-data]
simples_nacional = ["cnae_subclasses.tsv"]

[tool.setuptools.dynamic]
version = { attr = "simples_nacional.__version__" }
