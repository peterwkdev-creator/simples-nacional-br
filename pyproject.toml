[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simples-nacional-br"  # o do repositório e do catálogo MCP
dynamic = ["version"]  # uma fonte só: simples_nacional.__version__
# a mesma frase do GitHub e do catálogo MCP (mcpb/montar.py, DESCRICAO)
description = "Simples Nacional conferido contra a LC 123 e a LC 214: alíquota, DAS, repartição, Fator R e CNAE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter" }]
requires-python = ">=3.9"
dependencies = []
# os mesmos tópicos do repositório no GitHub
keywords = ["brasil", "simples-nacional", "das", "pgdas-d", "fator-r", "cnae", "lc-123",
            "tributario", "reforma-tributaria", "ibs", "cbs", "impostos", "contabilidade",
            "fiscal", "mcp", "mcp-server", "model-context-protocol", "python", "decimal",
            "pyodide"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
simples-nacional = "simples_nacional.__main__:main"
simples-nacional-cnae = "simples_nacional.cnae:main"
simples-nacional-mcp = "simples_nacional.mcp:main"
# o nome do pacote: `uvx simples-nacional-br` roda o servidor, como o catálogo MCP chama
simples-nacional-br = "simples_nacional.mcp:main"

[project.urls]
# como no GitHub: a página inicial é a vitrine; o código, o repositório
Homepage = "https://peterwkdev-creator.github.io/simples-nacional-br/"
Source = "https://github.com/peterwkdev-creator/simples-nacional-br"
Issues = "https://github.com/peterwkdev-creator/simples-nacional-br/issues"
Changelog = "https://github.com/peterwkdev-creator/simples-nacional-br/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["simples_nacional"]

[tool.setuptools.package-data]
# py.typed (PEP 561): o mypy e o pyright leem as anotações do pacote instalado
simples_nacional = ["cnae_subclasses.tsv", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "simples_nacional.__version__" }
