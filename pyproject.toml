[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simples-nacional"
version = "0.5.0"
description = "Simples Nacional: alíquota efetiva, valor do mês e Fator R, conferidos contra a LC 123/2006 e a LC 214/2025"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["simples nacional", "das", "fator r", "lc 123", "tributário"]
classifiers = [
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://github.com/peterwkdev-creator/simples-nacional-br"
Issues = "https://github.com/peterwkdev-creator/simples-nacional-br/issues"

[tool.setuptools]
packages = ["simples_nacional"]
